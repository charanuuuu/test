<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipkart Homepage</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f3f6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #fff;
            padding: 40px 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
        }
        h1 {
            color: #2874f0;
            margin-bottom: 24px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 12px 0;
            margin: 12px 0;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
        }
        .login-btn {
            background: #2874f0;
            color: #fff;
        }
        .register-btn {
            background: #fff;
            color: #2874f0;
            border: 2px solid #2874f0;
        }
        .signup-btn {
            background: #28a745;
            color: #fff;
            border: none;
        }
        .btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to Flipkart</h1>
        <a href="login.html" class="btn login-btn">Login</a>
        <a href="register.html" class="btn register-btn">Register</a>
        <a href="signup.html" class="btn signup-btn">New Signup</a>
    </div>
</body>
</html>
